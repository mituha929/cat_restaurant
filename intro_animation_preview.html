<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>貓咪主廚工作坊 - 前導動畫預覽</title>
    <style>
        :root {
            --orange: #ff7b54;
            --gold: #ffd166;
            --dark: #111827;
            --green: #54f68a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
            background: #070814;
            color: #fff;
        }

        .preview-stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 45%, rgba(80, 80, 170, 0.3), transparent 45%),
                linear-gradient(135deg, #060716, #111827 48%, #1f1238);
        }

        .preview-stage::after {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 45%, rgba(0, 0, 0, 0.35));
            z-index: 30;
        }

        .space-bg {
            position: absolute;
            inset: 0;
            opacity: 1;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(circle at 20% 18%, rgba(146, 197, 255, 0.18), transparent 28%),
                radial-gradient(circle at 80% 28%, rgba(255, 209, 255, 0.14), transparent 24%),
                radial-gradient(circle at 55% 82%, rgba(255, 184, 108, 0.1), transparent 30%),
                linear-gradient(135deg, #030514 0%, #0a1230 50%, #17082e 100%);
            overflow: hidden;
            transition: opacity 1s ease;
        }

        .space-bg::before,
        .space-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background-image:
                radial-gradient(#ffffff 0 1.1px, transparent 1.4px),
                radial-gradient(rgba(255,255,255,0.72) 0 1px, transparent 1.3px),
                radial-gradient(rgba(151, 206, 255, 0.9) 0 1.3px, transparent 1.7px);
            background-size: 120px 120px, 190px 190px, 280px 280px;
            background-position: 12px 28px, 54px 90px, 130px 36px;
            opacity: 0.8;
            animation: twinkleStars 4.5s ease-in-out infinite alternate;
        }

        .space-bg::after {
            opacity: 0.45;
            filter: blur(0.4px);
            transform: scale(1.04);
            animation-duration: 6.5s;
            animation-delay: -1.8s;
        }

        .meteor {
            position: absolute;
            top: -12%;
            left: 20%;
            width: 150px;
            height: 2px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.95));
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
            opacity: 0;
            transform: rotate(-34deg);
            animation: meteorFly 7s linear infinite;
        }

        .meteor:nth-child(1) {
            left: 18%;
            animation-delay: 0.9s;
        }

        .meteor:nth-child(2) {
            left: 72%;
            width: 112px;
            animation-delay: 3.7s;
            animation-duration: 8.6s;
        }

        .meteor:nth-child(3) {
            left: 48%;
            width: 130px;
            animation-delay: 6.1s;
            animation-duration: 9.2s;
        }

        .scene-img {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(42vw, 500px);
            max-width: 500px;
            height: auto;
            transform: translate(-50%, -50%);
            opacity: 0;
            transition:
                opacity 1s ease,
                transform 1.35s cubic-bezier(.2, .8, .2, 1),
                filter 1.15s ease;
            will-change: transform, opacity, filter;
            user-select: none;
            pointer-events: none;
        }

        .bg-img {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }

        .cat-scientist {
            left: 23%;
            top: 56%;
            width: min(28vw, 320px);
            z-index: 8;
            filter: drop-shadow(0 16px 30px rgba(0, 0, 0, 0.4));
        }

        .earth {
            left: 67%;
            top: 48%;
            width: min(28vw, 340px);
            z-index: 7;
            filter: drop-shadow(0 0 30px rgba(72, 170, 255, 0.45));
        }

        .taiwan,
        .taiwan-glow {
            width: min(32vw, 360px);
            z-index: 9;
        }

        .taipei {
            width: min(68vw, 700px);
            border-radius: 999px;
            z-index: 11;
            filter: saturate(1.08) drop-shadow(0 22px 50px rgba(255, 145, 90, 0.28));
        }

        .ufo {
            top: 5%;
            width: min(30vw, 340px);
            z-index: 17;
            filter: drop-shadow(0 14px 32px rgba(84, 246, 138, 0.42));
        }

        .beam {
            top: 48%;
            width: min(36vw, 390px);
            z-index: 16;
            mix-blend-mode: screen;
            filter: blur(0.3px) saturate(1.5);
        }

        .kitchen {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 20;
            filter: brightness(0.78) saturate(1.05);
        }

        .kitchen-video {
            position: absolute;
            inset: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            opacity: 0;
            z-index: 21;
            pointer-events: none;
            filter: brightness(0.9) saturate(1.05);
            transition: opacity 0.9s ease;
        }

        .black-chef {
            left: 34%;
            top: 56%;
            width: min(31vw, 360px);
            z-index: 22;
            filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.5));
        }

        .magic-book {
            position: absolute;
            right: 22%;
            top: 42%;
            width: min(23vw, 250px);
            height: min(30vw, 320px);
            opacity: 0;
            transform: translateY(30px) rotateY(0deg) scale(0.78);
            transform-style: preserve-3d;
            transition:
                opacity 0.9s ease,
                transform 1.35s cubic-bezier(.2, .8, .2, 1),
                filter 0.9s ease;
            z-index: 23;
            filter: drop-shadow(0 18px 35px rgba(255, 209, 102, 0.32));
        }

        .book-face {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 18px;
            border-radius: 22px;
            border: 4px solid var(--gold);
            backface-visibility: hidden;
            text-align: center;
            font-weight: 900;
            line-height: 1.35;
            box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.18);
        }

        .book-back {
            background: linear-gradient(145deg, #44228a, #182339);
            color: var(--gold);
            font-size: clamp(1.1rem, 2vw, 1.55rem);
        }

        .book-front {
            background: linear-gradient(145deg, #f59e0b, #e65f32);
            color: #fff;
            transform: rotateY(180deg);
            font-size: clamp(1rem, 1.6vw, 1.3rem);
        }

        .scan-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(42vw, 430px);
            aspect-ratio: 1;
            transform: translate(-50%, -50%) scale(0.35);
            border-radius: 50%;
            opacity: 0;
            z-index: 14;
            border: 0;
            background: radial-gradient(circle, rgba(84, 246, 138, 0.26) 0 5%, transparent 6% 100%);
            box-shadow: 0 0 28px rgba(84, 246, 138, 0.36);
            transition: opacity 0.6s ease, transform 1.2s ease;
        }

        .scan-ring::before,
        .scan-ring::after,
        .scan-ring .scan-wave {
            content: "";
            position: absolute;
            inset: 0;
            border: 4px solid rgba(84, 246, 138, 0.82);
            border-radius: 50%;
            opacity: 0;
            box-shadow:
                0 0 26px rgba(84, 246, 138, 0.68),
                inset 0 0 20px rgba(84, 246, 138, 0.22);
            transform: scale(0.18);
        }

        .scan-ring::after {
            animation-delay: 0.75s;
        }

        .scan-ring .scan-wave {
            animation-delay: 1.2s;
        }

        .warning-text {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            opacity: 0;
            padding: 18px 34px;
            border: 4px solid #ff3333;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.9);
            color: #ff4545;
            font-size: clamp(1.25rem, 4vw, 3.5rem);
            font-weight: 900;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.8);
            box-shadow: 0 0 45px rgba(255, 51, 51, 0.45);
            z-index: 28;
            transition: opacity 0.35s ease, transform 0.5s cubic-bezier(.2, .8, .2, 1);
        }

        .subtitle {
            position: absolute;
            left: 50%;
            bottom: 7%;
            transform: translateX(-50%);
            width: min(88vw, 900px);
            min-height: 82px;
            display: grid;
            place-items: center;
            padding: 16px 28px;
            border: 3px solid var(--orange);
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            font-size: clamp(1rem, 2vw, 1.35rem);
            font-weight: 800;
            line-height: 1.55;
            text-align: center;
            z-index: 40;
            backdrop-filter: blur(10px);
        }

        .controls {
            position: absolute;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 10px;
            z-index: 50;
        }

        .controls button {
            border: 0;
            border-radius: 999px;
            padding: 10px 16px;
            background: rgba(255, 123, 84, 0.95);
            color: #fff;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 123, 84, 0.25);
        }

        .phase-label {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 50;
            padding: 9px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            font-weight: 800;
            backdrop-filter: blur(8px);
        }

        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 25;
            overflow: hidden;
        }

        .spark {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--gold);
            opacity: 0;
            box-shadow: 0 0 14px currentColor;
        }

        .stage-earth .cat-scientist {
            opacity: 1;
            transform: translate(-50%, -50%) translateY(0);
            animation: floatCat 1.8s ease-in-out infinite alternate;
        }

        .stage-earth .earth {
            opacity: 0;
        }

        .stage-earth-zoom .cat-scientist {
            opacity: 0;
            transform: translate(-50%, -50%) translateX(-120px) scale(0.72);
        }

        .stage-earth-zoom .earth {
            opacity: 1;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.72);
        }

        .stage-earth-blur .earth {
            opacity: 1;
            left: 50%;
            transform: translate(-50%, -50%) scale(2.05);
            filter: blur(8px) brightness(1.05);
        }

        .stage-taiwan-focus .earth {
            opacity: 0.25;
            left: 50%;
            transform: translate(-50%, -50%) scale(2.45);
            filter: blur(14px);
        }

        .stage-taiwan-focus .taiwan {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .stage-taiwan-glow .taiwan {
            opacity: 0;
        }

        .stage-taiwan-glow .taiwan-glow {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.18);
            filter: drop-shadow(0 0 34px rgba(255, 209, 102, 0.9));
        }

        .stage-taiwan-blur .taiwan-glow {
            opacity: 0.72;
            transform: translate(-50%, -50%) scale(1.75);
            filter: blur(10px) brightness(1.2);
        }

        .stage-taipei .space-bg,
        .stage-scan .space-bg,
        .stage-ufo .space-bg,
        .stage-warning .space-bg {
            opacity: 0;
        }

        .stage-taipei .taiwan-glow {
            opacity: 0;
        }

        .stage-taipei .taipei,
        .stage-scan .taipei {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .stage-scan .scan-ring {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.22);
            animation: scanCorePulse 1.5s ease-in-out infinite;
        }

        .stage-scan .scan-ring::before,
        .stage-scan .scan-ring::after,
        .stage-scan .scan-ring .scan-wave {
            animation: scanRipple 1.8s ease-out infinite;
        }

        .stage-ufo .taipei {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            filter: brightness(0.55) saturate(0.9) drop-shadow(0 22px 50px rgba(0, 0, 0, 0.4));
            animation: taipeiVanish 2.2s ease 1.5s forwards;
        }

        .stage-warning .taipei {
            opacity: 0;
            transform: translate(-50%, -50%) scale(1.08);
            filter: brightness(0) blur(8px);
        }

        .stage-ufo .ufo {
            opacity: 1;
            top: 21%;
            transform: translate(-50%, -50%) scale(0.92);
        }

        .stage-warning .ufo {
            opacity: 0;
            top: 21%;
            transform: translate(-50%, -50%) scale(0.92);
        }

        .stage-ufo .beam {
            opacity: 0.85;
            transform: translate(-50%, -50%) scaleY(1.12);
            animation: beamFlicker 0.16s linear infinite alternate;
        }

        .stage-warning .beam {
            opacity: 0;
            transform: translate(-50%, -50%) scaleY(1.12);
        }

        .stage-warning {
            animation: screenShake 0.08s linear 22;
        }

        .stage-warning .warning-text {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .stage-kitchen .space-bg,
        .stage-kitchen .taipei,
        .stage-kitchen .ufo,
        .stage-kitchen .beam,
        .stage-kitchen .warning-text,
        .stage-kitchen .kitchen,
        .stage-kitchen .black-chef,
        .stage-kitchen .magic-book,
        .stage-finale .space-bg,
        .stage-finale .taipei,
        .stage-finale .ufo,
        .stage-finale .beam,
        .stage-finale .warning-text,
        .stage-finale .kitchen,
        .stage-finale .black-chef,
        .stage-finale .magic-book {
            opacity: 0;
        }

        .stage-kitchen .kitchen-video,
        .stage-finale .kitchen-video {
            opacity: 1;
        }

        .stage-finale .spark {
            opacity: 0;
            animation: none;
        }

        @keyframes floatCat {
            to {
                transform: translate(-50%, -50%) translateY(-14px);
            }
        }

        @keyframes twinkleStars {
            0% {
                opacity: 0.46;
                transform: translateY(0);
            }
            100% {
                opacity: 0.92;
                transform: translateY(-8px);
            }
        }

        @keyframes meteorFly {
            0%, 64% {
                opacity: 0;
                transform: translate3d(0, 0, 0) rotate(-34deg);
            }
            68% {
                opacity: 1;
            }
            78% {
                opacity: 0;
                transform: translate3d(-520px, 320px, 0) rotate(-34deg);
            }
            100% {
                opacity: 0;
                transform: translate3d(-520px, 320px, 0) rotate(-34deg);
            }
        }

        @keyframes scanCorePulse {
            0%, 100% {
                background: radial-gradient(circle, rgba(84, 246, 138, 0.2) 0 5%, transparent 6% 100%);
                box-shadow: 0 0 20px rgba(84, 246, 138, 0.3);
            }
            50% {
                background: radial-gradient(circle, rgba(84, 246, 138, 0.42) 0 5%, transparent 6% 100%);
                box-shadow: 0 0 46px rgba(84, 246, 138, 0.78);
            }
        }

        @keyframes scanRipple {
            0% {
                opacity: 0;
                transform: scale(0.16);
                border-width: 5px;
            }
            12% {
                opacity: 0.95;
            }
            100% {
                opacity: 0;
                transform: scale(1.55);
                border-width: 1px;
            }
        }

        @keyframes beamFlicker {
            from { opacity: 0.58; }
            to { opacity: 0.95; }
        }

        @keyframes taipeiVanish {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
                filter: brightness(0.55) saturate(0.9) blur(0) drop-shadow(0 22px 50px rgba(0, 0, 0, 0.4));
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.08);
                filter: brightness(0.05) saturate(0.35) blur(7px) drop-shadow(0 22px 50px rgba(0, 0, 0, 0.4));
            }
        }

        @keyframes screenShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(8px, -5px); }
            50% { transform: translate(-8px, 5px); }
            75% { transform: translate(5px, 8px); }
        }

        @keyframes sparkle {
            0% {
                opacity: 0;
                transform: translate(0, 0) scale(0.5);
            }
            18% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0);
            }
        }

        @media (max-width: 760px) {
            .cat-scientist {
                left: 25%;
                top: 64%;
                width: 40vw;
            }

            .earth {
                left: 68%;
                top: 42%;
                width: 42vw;
            }

            .taiwan,
            .taiwan-glow {
                width: 52vw;
            }

            .taipei {
                width: 92vw;
            }

            .ufo {
                width: 48vw;
            }

            .beam {
                width: 58vw;
            }

            .black-chef {
                left: 35%;
                top: 58%;
                width: 46vw;
            }

            .magic-book {
                right: 8%;
                top: 38%;
                width: 32vw;
                height: 42vw;
            }

            .controls {
                top: auto;
                right: 12px;
                bottom: 12px;
            }

            .phase-label {
                left: 12px;
                top: 12px;
                font-size: 0.82rem;
            }

            .subtitle {
                bottom: 72px;
                min-height: 68px;
                padding: 12px 16px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>
    <main id="stage" class="preview-stage stage-earth" aria-live="polite">
        <div class="space-bg" aria-hidden="true">
            <span class="meteor"></span>
            <span class="meteor"></span>
            <span class="meteor"></span>
        </div>
        <img class="scene-img cat-scientist" src="gemini_photo/cat_scientist_1782179342453.png" alt="貓咪科學家">
        <img class="scene-img earth" src="gemini_photo/cute_earth_1782179399607.png" alt="地球">
        <img class="scene-img taiwan" src="gemini_photo/cute_taiwan_1782179431802.png" alt="台灣島">
        <img class="scene-img taiwan-glow" src="gemini_photo/glowing_taiwan_1782179463806.png" alt="發光台灣島">
        <img class="scene-img bg-img taipei" src="gemini_photo/taipei_skyline_1782179501457.png" alt="台北城市">
        <img class="scene-img ufo" src="gemini_photo/cute_ufo_1782179549164.png" alt="UFO">
        <img class="scene-img beam" src="gemini_photo/tractor_beam_1782179577712.png" alt="綠色牽引光束">
        <img class="scene-img bg-img kitchen" src="gemini_photo/mysterious_kitchen_1782179625213.png" alt="神秘廚房">
        <img class="scene-img black-chef" src="gemini_photo/black_cat_chef_1782180010502.png" alt="黑貓主廚">
        <video id="kitchenVideo" class="kitchen-video" src="gemini_photo/cat_kitchen.mp4" muted playsinline preload="auto"></video>

        <div class="scan-ring" aria-hidden="true">
            <span class="scan-wave"></span>
        </div>
        <div class="warning-text">ERROR 404<br>HUMAN CODE DELETED</div>
        <div class="magic-book" aria-hidden="true">
            <div class="book-face book-back">人類<br>究極食譜</div>
            <div class="book-face book-front">壽司 + 漢堡<br>飯糰 + 濃湯</div>
        </div>
        <div id="particles" class="particles" aria-hidden="true"></div>

        <div id="phaseLabel" class="phase-label">前導動畫預覽</div>
        <div id="subtitle" class="subtitle">貓咪科學家透過望遠鏡，發現了一顆充滿美食能量的星球。</div>
        <div class="controls">
            <button id="replayBtn" type="button">重新播放</button>
            <button id="nextBtn" type="button">下一幕</button>
        </div>
    </main>

    <script>
        const stage = document.getElementById("stage");
        const subtitle = document.getElementById("subtitle");
        const phaseLabel = document.getElementById("phaseLabel");
        const replayBtn = document.getElementById("replayBtn");
        const nextBtn = document.getElementById("nextBtn");
        const particles = document.getElementById("particles");
        const kitchenVideo = document.getElementById("kitchenVideo");

        const scenes = [
            {
                className: "stage-earth",
                label: "1 / 12 貓咪觀測地球",
                text: "貓咪科學家透過望遠鏡，發現了一顆充滿美食能量的星球。",
                duration: 2300
            },
            {
                className: "stage-earth-zoom",
                label: "2 / 12 地球慢慢放大",
                text: "鏡頭逐漸靠近地球，神祕的美食反應越來越明顯。",
                duration: 2200
            },
            {
                className: "stage-earth-blur",
                label: "3 / 12 地球模糊",
                text: "地球畫面開始模糊，鏡頭準備鎖定更精準的位置。",
                duration: 1700
            },
            {
                className: "stage-taiwan-focus",
                label: "4 / 12 聚焦台灣",
                text: "畫面聚焦到台灣，一股強烈的料理能量正在浮現。",
                duration: 2200
            },
            {
                className: "stage-taiwan-glow",
                label: "5 / 12 台灣島發光",
                text: "台灣島開始發光，像是在呼喚遠方的主廚。",
                duration: 2200
            },
            {
                className: "stage-taiwan-blur",
                label: "6 / 12 台灣轉場",
                text: "光芒逐漸擴散，城市的輪廓從模糊中慢慢出現。",
                duration: 1700
            },
            {
                className: "stage-taipei",
                label: "7 / 12 台北城市出現",
                text: "鏡頭降落到台北，夕陽照亮城市，美食能量正在街道間流動。",
                duration: 2500
            },
            {
                className: "stage-scan",
                label: "8 / 12 美食能量掃描",
                text: "掃描系統鎖定台北，美食能量反應突破臨界值。",
                duration: 2300
            },
            {
                className: "stage-ufo",
                label: "9 / 12 UFO 降臨",
                text: "天空突然暗下，巨大的飛碟從雲層中降臨。",
                duration: 4000
            },
            {
                className: "stage-warning",
                label: "10 / 12 人類資料消失",
                text: "綠色光束掃過城市，人類資料被重新編碼。",
                duration: 2600
            },
            {
                className: "stage-kitchen",
                label: "11 / 12 神秘廚房",
                text: "黑暗逐漸散去，神秘廚房中出現了新的主廚。",
                duration: 2300
            },
            {
                className: "stage-finale",
                label: "12 / 12 食譜覺醒",
                text: "神秘食譜書發光翻開，貓咪主廚準備復甦地球的究極美食！",
                duration: 3200
            }
        ];

        let sceneIndex = 0;
        let timer = null;

        function createSparks() {
            particles.innerHTML = "";
            for (let i = 0; i < 44; i += 1) {
                const spark = document.createElement("span");
                spark.className = "spark";
                spark.style.setProperty("--x", `${Math.random() * 360 - 180}px`);
                spark.style.setProperty("--y", `${Math.random() * 280 - 150}px`);
                spark.style.left = `${58 + Math.random() * 16}%`;
                spark.style.top = `${35 + Math.random() * 24}%`;
                spark.style.animationDelay = `${Math.random() * 1.2}s`;
                particles.appendChild(spark);
            }
        }

        function showScene(index, shouldAutoPlay = true) {
            clearTimeout(timer);
            sceneIndex = index % scenes.length;
            const scene = scenes[sceneIndex];

            stage.className = `preview-stage ${scene.className}`;
            subtitle.textContent = scene.text;
            phaseLabel.textContent = scene.label;

            if (scene.className === "stage-kitchen" || scene.className === "stage-finale") {
                if (scene.className === "stage-kitchen") {
                    kitchenVideo.currentTime = 0;
                }
                kitchenVideo.play().catch(() => {});
            } else {
                kitchenVideo.pause();
            }

            if (shouldAutoPlay) {
                timer = setTimeout(() => {
                    showScene(sceneIndex + 1, sceneIndex + 1 < scenes.length);
                }, scene.duration);
            }
        }

        replayBtn.addEventListener("click", () => {
            showScene(0, true);
        });

        nextBtn.addEventListener("click", () => {
            showScene(sceneIndex + 1, false);
        });

        showScene(0, true);
    </script>
</body>
</html>
